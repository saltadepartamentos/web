          <h2>Comodidades</h2>
          <div class="amenities-grid">
            ${depto.amenities.map(a => `<div class="amenity-item">${iconCheck}${a}</div>`).join("")}
          </div>
        </div>
      </div>
      <div class="booking-card">
        ${priceHtml}
        <div class="booking-actions">
          ${depto.reservaLinks && depto.reservaLinks.airbnb ? `<a class="btn-book" href="${depto.reservaLinks.airbnb}" target="_blank">Reservar en Airbnb</a>` : ""}
          ${depto.reservaLinks && depto.reservaLinks.booking ? `<a class="btn-book" href="${depto.reservaLinks.booking}" target="_blank">Reservar en Booking</a>` : ""}
          <a class="btn-wa" href="${waLink(depto)}" target="_blank" onclick="gtag('event', 'conversion', {'send_to': 'AW-18393423487/E5AHCNTs5eIcEP-81cJE'});">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Consultar por WhatsApp
          </a>
        </div>
      </div>
    </div>
  `;

  /* ---------- Reserva ----------
     La cotizacion la resuelve el Worker, no el navegador: asi el precio que
     ve el huesped es el mismo que queda anotado en el panel. */
  (function(){
    const $ = id => document.getElementById(id);
    const fIn = $("bk-in"), fOut = $("bk-out"), fPer = $("bk-per");
    const caja = $("bk-detalle"), err = $("bk-error"), boton = $("bk-enviar");
    const hoy = new Date().toISOString().slice(0,10);
    fIn.min = hoy; fOut.min = hoy;

    if(qp.get("checkin")) fIn.value = qp.get("checkin");
    if(qp.get("checkout")) fOut.value = qp.get("checkout");
    if(qp.get("personas")){
      const n = Math.min(parseInt(qp.get("personas"),10) || 2, depto.huespedes);
      fPer.value = String(n);
    }

    const plata = n => "$" + Number(n).toLocaleString("es-AR");
    const fecha = f => f ? f.split("-").reverse().join("/") : "";
    let cot = null;

    function aviso(caja, texto, clase){
      caja.innerHTML = texto ? `<div class="bk-aviso ${clase||""}">${texto}</div>` : "";
    }

    async function cotizar(){
      cot = null;
      if(!fIn.value || !fOut.value){
        caja.innerHTML = `<div class="bk-detalle" style="color:var(--tierra)">Elegí las fechas y te mostramos el precio exacto.</div>`;
        return;
      }
      if(fOut.value <= fIn.value){ aviso(caja, "La salida tiene que ser posterior a la entrada.", "mal"); return; }
      caja.innerHTML = `<div class="bk-detalle">Calculando…</div>`;
      try{
        const r = await fetch(`${API}/cotizar?depto=${encodeURIComponent(depto.id)}&checkin=${fIn.value}&checkout=${fOut.value}&personas=${fPer.value}`);
        const c = await r.json();
        if(!c.ok){ aviso(caja, c.mensaje || "No podemos cotizar esas fechas.", "mal"); return; }
        cot = c;
        /* Con fechas elegidas, el "desde" ya no aporta y confunde al lado del
           precio real de esas noches. */
        const desde = document.getElementById("bk-desde");
        if(desde) desde.style.display = "none";
        caja.innerHTML = `
          <div class="bk-detalle">
            <div class="bk-linea"><span>${fecha(c.checkin)} → ${fecha(c.checkout)}</span><span>${c.noches} ${c.noches===1?"noche":"noches"}</span></div>
            <div class="bk-linea"><span>${plata(c.tarifaPorNoche)} por noche</span><span>${c.personas} ${c.personas===1?"huésped":"huéspedes"}</span></div>
            <div class="bk-linea bk-total"><span>Total</span><span>${plata(c.total)} ARS</span></div>
          </div>`;
      }catch(e){ aviso(caja, "No pudimos calcular el precio. Escribinos por WhatsApp.", "mal"); }
    }

    [fIn, fOut, fPer].forEach(el => el.addEventListener("change", cotizar));
    cotizar();

    $("bk-form").addEventListener("submit", async function(e){
      e.preventDefault();
      const nombre = $("bk-nombre").value.trim();
      const tel = $("bk-tel").value.trim();
      const email = $("bk-email").value.trim();
      const mensaje = $("bk-msg").value.trim();

      if(!fIn.value || !fOut.value){ aviso(err, "Elegí las fechas de entrada y salida.", "mal"); return; }
      if(!nombre || !tel){ aviso(err, "Necesitamos tu nombre y un WhatsApp para responderte.", "mal"); return; }
      if(!cot){ aviso(err, "Todavía no tenemos precio para esas fechas.", "mal"); return; }
      aviso(err, "");

      /* WhatsApp se abre YA, en el mismo gesto del clic: si se abriera despues
         de esperar la respuesta del servidor, el navegador lo bloquea por
         considerarlo una ventana no pedida. */
      const texto = [
        "Hola! Quiero reservar por la web.",
        "",
        depto.nombre,
        `Entrada: ${fecha(fIn.value)}`,
        `Salida: ${fecha(fOut.value)}`,
        `Noches: ${cot.noches}`,
        `Huéspedes: ${fPer.value}`,
        `Total: ${plata(cot.total)} ARS`,
        "",
        `Nombre: ${nombre}`,
        `Contacto: ${tel}`,
        email ? `Correo: ${email}` : "",
        mensaje ? `Nota: ${mensaje}` : "",
        "",
        "Quedo a la espera para coordinar el pago."
      ].filter(Boolean).join("\n");
      const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(texto)}`;

      gtag('event', 'conversion', {'send_to': 'AW-18393423487/E5AHCNTs5eIcEP-81cJE'});
      window.open(waUrl, "_blank");

      boton.disabled = true; boton.textContent = "Enviando…";
      let guardada = false;
      try{
        const r = await fetch(`${API}/solicitud`, {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ depto: depto.id, entrada: fIn.value, salida: fOut.value,
            personas: parseInt(fPer.value,10), nombre, email, telefono: tel, mensaje })
        });
        const res = await r.json();
        guardada = r.ok && res.ok;
      }catch(e){ guardada = false; }

      document.querySelector(".booking-card").innerHTML = `
        <div class="bk-aviso bien" style="font-size:14px;line-height:1.7">
          <strong>Recibimos tu pedido.</strong><br>
          ${depto.nombre} · ${fecha(fIn.value)} al ${fecha(fOut.value)} · ${plata(cot.total)} ARS<br><br>
          Te abrimos WhatsApp con todo el detalle. Si no se abrió,
          <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(texto)}" target="_blank"><strong>tocá acá</strong></a>.
          ${guardada ? "" : "<br><br>No pudimos registrarlo automáticamente, así que el mensaje de WhatsApp es lo que vale."}
        </div>`;
    });
  })();

  // Galeria interactiva
  let current = 0;
  const mainImg = document.getElementById("gallery-main-img");
  const mainWrap = document.getElementById("gallery-main");
  const countEl = mainWrap.querySelector(".gallery-count");
  const thumbs = document.querySelectorAll("#gallery-thumbs img");

  function setPhoto(i){
    current = (i + photos.length) % photos.length;
    mainImg.src = photos[current].src;
    mainImg.alt = photos[current].alt;
    if(countEl) countEl.textContent = `${current+1} / ${photos.length}`;
    thumbs.forEach(t => t.classList.toggle("active", parseInt(t.dataset.i) === current));
  }
  thumbs.forEach(t => t.addEventListener("click", () => setPhoto(parseInt(t.dataset.i))));

  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbCount = document.getElementById("lb-count");

  function openLightbox(i){
    setPhoto(i);
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].alt;
    lbCount.textContent = `${current+1} / ${photos.length}`;
    lightbox.classList.add("open");
  }
  function closeLightbox(){ lightbox.classList.remove("open"); }
  function lbNav(delta){
    setPhoto(current + delta);
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].alt;
    lbCount.textContent = `${current+1} / ${photos.length}`;
  }

  mainWrap.addEventListener("click", () => openLightbox(current));
  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", () => lbNav(-1));
  document.getElementById("lb-next").addEventListener("click", () => lbNav(1));
  lightbox.addEventListener("click", (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if(!lightbox.classList.contains("open")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowLeft") lbNav(-1);
    if(e.key === "ArrowRight") lbNav(1);
  });
}
</script>
</body>
</html>
