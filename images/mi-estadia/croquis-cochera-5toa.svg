<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Croquis orientativo: se entra por el portón negro, a la izquierda de la puerta principal, y se sigue hacia el fondo; las cocheras de la mano derecha." font-family="Inter,Arial,Helvetica,sans-serif">
<rect width="360" height="640" fill="#F6F8F9"/>
<rect x="10" y="14" width="340" height="448" rx="14" fill="#E6ECEF" stroke="#9FB0BB" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0E2432">Sector de cocheras (atrás del edificio)</text>
<rect x="130" y="84" width="120" height="56" rx="8" fill="#F2B23A" stroke="#0E2432" stroke-width="3"/><text x="190" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#0E2432">Cochera i</text><text x="190" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#0E2432">la última</text>
<rect x="130" y="150" width="120" height="228" rx="8" fill="none" stroke="#9FB0BB" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="190" y="270" text-anchor="middle" font-size="14" fill="#3B5568">otras cocheras</text>
<rect x="130" y="384" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#0E2432" stroke-width="1.5"/><text x="190" y="420" text-anchor="middle" font-size="14" fill="#3B5568">otra cochera</text>
<path d="M70 556 V104" stroke="#E9A11B" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M54 122 L70 96 L86 122 Z" fill="#E9A11B"/>
<text transform="translate(52 330) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" fill="#0E2432">Siguen hacia el fondo</text>
<path d="M262 104 V440" stroke="#0E2432" stroke-width="2"/>
<text transform="translate(290 270) rotate(90)" text-anchor="middle" font-size="14" font-weight="600" fill="#0E2432">Mano derecha al ingresar</text>
<rect x="10" y="462" width="340" height="112" fill="#3B5568"/>
<text x="250" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Edificio</text>
