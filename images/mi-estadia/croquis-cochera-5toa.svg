<text x="70" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Portón</text>
<text x="70" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">negro</text>
<rect x="220" y="534" width="60" height="40" fill="#F2B23A"/>
<text x="250" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Puerta principal</text>
<rect x="0" y="574" width="360" height="66" fill="#CFD8DE"/>
<text x="180" y="613" text-anchor="middle" font-size="16" font-weight="600" fill="#0E2432">Calle Pueyrredón</text>
</svg>